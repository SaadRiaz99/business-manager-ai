<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizPilot AI</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><div><p class="eyebrow">BUSINESS COMMAND CENTER</p><h1>BizPilot AI</h1><p>Multi-agent automation for any business.</p></div></header>
<section class="metrics" id="metrics"></section>
<section class="grid"><article class="panel"><h2>Lead pipeline</h2><table><thead><tr><th>Company</th><th>Score</th><th>Stage</th><th>Value</th></tr></thead><tbody id="leads"></tbody></table></article><article class="panel"><h2>Tasks</h2><form id="task-form"><input id="task-title" placeholder="Add task" required><button>+</button></form><div id="tasks"></div></article></section>
<section class="panel automation"><p class="eyebrow">MULTI-AGENT AUTOMATION</p><h2>Automate any kind of business</h2><p>Works for restaurants, schools, clinics, shops, agencies, e-commerce, services, and custom workflows.</p>
<form id="automation-form"><input name="business_name" value="My Business" placeholder="Business name" required><input name="business_type" placeholder="Business type" required><input name="channels" placeholder="WhatsApp, email, website"><textarea name="goal" placeholder="What should the business automate?" required></textarea><button>Build automation plan</button></form><div id="automation-result" class="agents"></div></section></main><script src="/static/app.js"></script></body></html>
